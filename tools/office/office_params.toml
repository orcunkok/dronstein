[gate]                # main roll-up gate on the south wall, always closed
# IMG_3077 (whole south wall at one depth, 1x lens, exit door 2.13 m = 115 px): opening 6.0 x 4.5 m, med
# The exit door and the big window are placed from the stair, the gate from the west wall; IMG_3059 gives gate ~5.6-6 m,
# ~0.85 m wall to the exit door, ~0.8 m to the west corner, so the hall is likely ~22 m, not 23 (questions.md). Until it
# is measured the extra width sits between the gate and the exit door.
z0 = -15.0            # west edge, under the window units above it (user)
z1 = -9.0             # east edge; ~1 m of plain wall to the exit door (photos show ~0.85 m)
height = 4.2          # opening, under a 0.49 m roller hood: IMG_3089/3059, med
hood_top = 4.685      # top of the roller hood, level with the line between the stair window's 5th and 6th pane
