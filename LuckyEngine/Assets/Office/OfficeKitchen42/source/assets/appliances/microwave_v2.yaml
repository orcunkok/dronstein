  - { from: { node: 41, pin: Geometry }, to: { node: 42, pin: Geometry } }
  - { from: { node: 50, pin: Geometry }, to: { node: 51, pin: Geometry } }
  - { from: { node: 52, pin: Geometry }, to: { node: 53, pin: Geometry } }
  - { from: { node: 54, pin: Geometry }, to: { node: 55, pin: Geometry } }

  - { from: { node: 3,  pin: Geometry }, to: { node: 60, pin: A } }
  - { from: { node: 12, pin: Geometry }, to: { node: 60, pin: B } }
