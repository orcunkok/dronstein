# of mezzanine and box deck. Inside the 0.3 m walls that is about 22.3 x 30.2 m. The photos agree on the width: the
# south end summed east to west in IMG_3077 (box, corridor, partition, U stair, exit door, pier, gate) is about
# 23 m; that is used (3% over the lot record). med
x0 = -15.0            # north wall; length 30 m (record 30.2), med
x1 = 15.0             # south wall (main gate wall)
z0 = -16.0            # west wall; width 23.0 m: IMG_3077 south wall sum, record 22.3 m, med
z1 = 7.0              # east wall (kitchen)
wall_height = 9.3     # floor to roof bearing on the east and west walls (user)
ridge = 10.5          # roof underside across its flat middle (user)
drop_end = 9.6        # the flat middle's ends slope down to this at the north and south walls (user)
wall_thickness = 0.3
roof_thickness = 0.3
west_beams = 2         # steel I-beams on the west wall, 9.5" x 15.5", 0.22 m off the wall, equal gaps between them
west_beam = [0.241, 0.394, 0.22]   # and to the end walls: flange, depth, gap to the wall (user)
truss_x = [-5.0, 5.0]  # two A-frame trusses of thin steel angles east-west at thirds of the length, on the west
                       # wall's I-beam columns, under the ten north-south roof I-beams (user, IMG_3106-3108)

[curtain]
z = -5.5              # greyish-white stage curtain, in line with the east side of the middle north window group's
