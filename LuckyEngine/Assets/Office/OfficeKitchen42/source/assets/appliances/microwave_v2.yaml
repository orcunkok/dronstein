  - { from: { node: 64, pin: Geometry }, to: { node: 65, pin: A } }
  - { from: { node: 53, pin: Geometry }, to: { node: 65, pin: B } }
  - { from: { node: 65, pin: Geometry }, to: { node: 66, pin: A } }
  - { from: { node: 55, pin: Geometry }, to: { node: 66, pin: B } }
  - { from: { node: 66, pin: Geometry }, to: { node: 99, pin: Geometry } }

