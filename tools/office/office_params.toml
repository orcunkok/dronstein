# Main measurements of the Lucky Robots office (535 Minnesota St), read by build_office.py and office_scene.py.
# Edit a value here, then rebuild (build_office.py, import_office.py). Metres.
#
# Plan frame: x runs from the north wall (x0) to the south wall (x1), z from the west wall (z0) to the east wall (z1,
# the kitchen), y up from the floor. The graphs are mirrored in x when built, so in the Lucky scene the north wall
# is at +15.
# Each value says where it comes from: a public record, a photo with a known reference (doors 0.91 x 2.13 m,
# counters 0.91 m, fridges 0.91 x 1.78 m) and how sure it is. "estimate" means a guess to replace with a real
# measurement.

[hall]
# Size: the building fills its lot. Record: 7,586 SF lot (about 75 x 101 ft), 8,235 SF building = lot + about 650 SF
# of mezzanine and box deck. Inside the 0.3 m walls that is about 22.3 x 30.2 m. The photos agree on the width: the
# south end summed east to west in IMG_3077 (box, corridor, partition, U stair, exit door, pier, gate) is about
# 23 m; that is used (3% over the lot record). med
x0 = -15.0            # north wall; length 30 m (record 30.2), med
x1 = 15.0             # south wall (main gate wall)
z0 = -16.0            # west wall; width 23.0 m: IMG_3077 south wall sum, record 22.3 m, med
z1 = 7.0              # east wall (kitchen)
wall_height = 7.3     # floor to roof bearing: IMG_3077 7.4 m and IMG_3059 7.3 m vs the exit door, med
ridge = 9.3           # roof underside at the ridge: photos, low
wall_thickness = 0.3
roof_thickness = 0.3
truss_x = [-11.25, -3.75, 3.75, 11.25]   # 7.5 m bays: photos, low

[curtain]
z = -4.0              # black stage curtain line: west bay 9 m, east bay 11 m, low
x0 = -14.0            # 1 m gap at the north wall: IMG_3053, med
x1 = 0.0
top = 6.6

[kitchen]
x0 = -1.6             # north end of the run on the east wall; it ends with the pantry against the box's north
                      # face (IMG_3071); run length 6.04 m from appliance sizes, med

[gate]                # main roll-up gate on the south wall, always closed
# IMG_3077 (whole south wall at one depth, 1x lens, exit door 2.13 m = 115 px): opening 6.0 x 4.5 m, med
z0 = -15.6            # west edge, ~0.4 m from the west corner: IMG_3077, med
z1 = -9.6             # east edge, 0.85 m (with the pier) from the exit door: IMG_3077, med
height = 4.5          # opening: IMG_3077, med
