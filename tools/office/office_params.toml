# Main measurements of the Lucky Robots office (535 Minnesota St), read by build_office.py and office_scene.py.
# Edit a value here, then rebuild (build_office.py, import_office.py). Metres.
#
# Plan frame: x runs from the north wall (x0) to the south wall (x1), z from the west wall (z0) to the east wall (z1,
# the kitchen), y up from the floor. The graphs are mirrored in x when built, so in the Lucky scene the north wall
# is at +15.
# Each value says where it comes from: a public record, a photo with a known reference (doors 0.91 x 2.13 m,
# counters 0.91 m, fridges 0.91 x 1.78 m) and how sure it is. "estimate" means a guess to replace with a real
# measurement.

[hall]
