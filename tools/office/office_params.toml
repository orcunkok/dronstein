[exit_door]           # grey steel exit door on the south wall, EXIT sign above, fire panel east of it
z0 = -8.05            # 1.15 m leaf, 2.13 m high, its west side a couple of inches past the window above it: IMG_3089, user
z1 = -6.9             # 0.9 m west of the U stair, the fire alarm gear between with a gap to the stair: IMG_3089, user
height = 2.13

[south_wall]
# Steel-sash windows, north and south walls alike: 0.5 x 0.343 m panes, all tops at one height, set into the wall a
