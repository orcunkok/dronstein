# wall spaces its sections with equal gaps, both ends included (user, IMG_3053/3063/3077/3088).
# South: three 4 x 4 units over the gate, the 8 x 11 window over the exit door and stair, two 8 x 4 over the upper deck.
south_sections = [[3, 4, 4], [1, 8, 11], [1, 8, 4], [1, 8, 4]]
