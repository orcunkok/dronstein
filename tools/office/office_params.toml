# New photo set lucky_office/mezazine (IMG_3087-3094), see lucky_office/CATALOGUE.md and questions.md.

[box]                 # the closed restroom box; its flat roof is the lower deck (black baluster railing)
x0 = 5.15             # north face, ~0.7 m south of the kitchen pantry's end: IMG_3094, med
x1 = 10.9             # south face = the alley's north wall; west face 5.75 m long: IMG_3092/3087/3072, med
z0 = 2.6              # west face, facing the hall: 4.4 m wide, IMG_3071 (MEN door scale), med
z1 = 7.0              # against the east (kitchen) wall, med
